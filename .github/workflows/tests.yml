name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cascade:
    name: Real WordPress cascade deletion
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: wordpress
          MYSQL_DATABASE: apiary_press_tests
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --password=wordpress"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, mbstring, gd
          tools: composer
      - name: Install WP-CLI in the runner temporary directory
        run: |
          mkdir -p "$RUNNER_TEMP/apiary-bin"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/apiary-bin/wp" https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x "$RUNNER_TEMP/apiary-bin/wp"
          "$RUNNER_TEMP/apiary-bin/wp" --version
          echo "$RUNNER_TEMP/apiary-bin" >> "$GITHUB_PATH"
      - name: Install production dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-plugins --no-scripts
      - name: Create runner-local WordPress
        env:
          WP_PATH: ${{ runner.temp }}/wordpress
        run: |
          wp core download --path="$WP_PATH"
          wp config create --path="$WP_PATH" --dbname=apiary_press_tests --dbuser=root --dbpass=wordpress --dbhost=127.0.0.1
          wp core install --path="$WP_PATH" --url=http://apiary.test --title=Apiary --admin_user=admin --admin_password=ci-only-password --admin_email=admin@example.test --skip-email
          ln -s "$GITHUB_WORKSPACE" "$WP_PATH/wp-content/plugins/apiary-press"
          wp plugin activate apiary-press --path="$WP_PATH"
      - name: Run actual cascade regression
        env:
          WP_PATH: ${{ runner.temp }}/wordpress
          APIARY_PRESS_TESTS: '1'
        run: wp --path="$WP_PATH" --url=http://apiary.test --user=admin eval-file "$GITHUB_WORKSPACE/tests/cascade-deletion.php"
